name: app_mi_upc
description: "Integrar la funcionalidad de Mi Upc"
version: 0.0.1
homepage: "https://siipne.policia.gob.ec/indexSiipne.php"

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  get: ^4.7.3 #manejador de estados - en uso cuando se descragn el proyecto
  local_auth: ^3.0.1 # Acceso Biometrico - en uso cuando se descragn el proyecto


  #Utilidades - device_info.dart
  device_info_plus: ^12.3.0 #Informacion del cell,Version Sistema Operatvivo - en uso cuando se descragn el proyecto
  network_info_plus: ^7.0.0 #Obtener ip del celular (se deben asiganr permisos para IOS) - en uso cuando se descragn el proyecto
  package_info_plus: ^9.0.0 #obtener version code de la app - en uso cuando se descragn el proyecto
  #END Utilidades - device_info.dart

  url_launcher: ^6.3.2 # Abrir Urls- en uso cuando se descragn el proyecto
  share_plus: ^12.0.1 #Compartir aplicacion- en uso cuando se descragn el proyecto
  awesome_dialog: ^3.3.0 #Dialogos- en uso cuando se descragn el proyecto
  image: ^4.8.0 #Para trabajar con imagenes de la galeria - en uso cuando se descragn el proyecto
  shared_preferences: ^2.5.4 #- en uso cuando se descragn el proyecto
  # intl: ^0.18.0 #Conversion de idiomas, enteros, fechas



  connectivity_plus: ^7.0.0 # Verifica a que tipo de red esta conectado


  permission_handler: ^12.0.1 # Solicita Permisos del dispositivo al usuario (Ubicacion,Galeria.....)



  http: ^1.6.0 # Conectar con proveedor - Apis
  rxdart: ^0.28.0 # se usa en el check_internet_conexion.dart


flutter:
  assets:
    - assets/img/img/
    - assets/img/icon/
